name: tests

on:
  push:
    branches: [main, stage-2-harness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
        include:
          # The oldest supported Node, checked on one platform so the engines
          # field in package.json stays honest. The floor is 20 because
          # playwright-core declares engines >=20.
          - os: ubuntu-latest
            node: '20'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The end-to-end suite drives a real browser. GitHub's images ship Chrome,
      # but pinning it here means a change to the image cannot silently turn the
      # e2e tests into skips.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # Prefer a released Google Chrome over a standalone Chromium snapshot.
      # setup-chrome installs Chromium on macOS, and its DevTools protocol
      # drifts from what playwright-core expects: the browser launches and a
      # context opens, then creating a page never returns. Released Chrome is
      # also what a developer actually has, which is the thing worth testing.
      - name: Choose the browser
        shell: bash
        timeout-minutes: 2
        run: |
          chrome_app="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -x "$chrome_app" ]; then
            picked="$chrome_app"
          else
            picked="${{ steps.chrome.outputs.chrome-path }}"
          fi
          echo "NOTLOCALHOST_BROWSER_PATH=$picked" >> "$GITHUB_ENV"
          echo "using: $picked"
          # Deliberately no `--version` here. On Windows chrome.exe does not
          # print a version and exit; it hands off to an existing browser
          # session and never returns, which hangs the step until the job
          # timeout. The later diagnostic step probes the version through
          # Node, which bounds it.

      - run: npm ci

      - name: Report the browser that will be used
        shell: bash
        run: node bin/notlocalhost.js --list-browsers

      - name: Lint and invariants
        run: npm run lint

      # First, because if the published interface moved then nothing else in this
      # run matters. These assert on parsing and exit codes, not on findings.
      - name: Published contract
        run: npm run test:compat

      # A suite that skips itself reports success having proven nothing.
      - name: Assert the contract suite actually ran
        shell: bash
        run: |
          out=$(npm run --silent test:compat)
          ran=$(printf '%s' "$out" | grep -E '^# tests ' | grep -oE '[0-9]+' | head -1)
          echo "contract assertions: ${ran:-0}"
          if [ "${ran:-0}" -lt 20 ]; then
            echo "::error::the contract suite ran ${ran:-0} tests; it is not verifying the shipped surface"
            exit 1
          fi

      - name: Unit tests
        run: npm run test:unit

      - name: End-to-end tests
        run: npm run test:e2e

      # node --test can print "not ok" for a cancelled suite and still exit 0,
      # so the per-suite steps above are not sufficient on their own. This one
      # reads the TAP output and refuses a run that proved less than it claims.
      #
      # The analyzer suites only: this job has no Caddy, so the harness suites
      # would skip themselves and trip the floor. They are run under the same
      # checker in the harness job, where Caddy exists.
      - name: Analyzer suites, judged by output rather than exit code
        run: >-
          node scripts/check-test-output.mjs
          test/compat.test.js test/unit.test.js test/e2e.test.js test/report.test.js test/diff.test.js
          --min 140

      # The e2e suite skips itself when no browser is present, which would let a
      # broken browser lookup pass CI silently. Fail loudly instead.
      - name: Assert the e2e suite actually ran
        shell: bash
        run: |
          out=$(npm run --silent test:e2e 2>&1 || true)
          if echo "$out" | grep -qi "no Chrome, Chromium or Edge installed"; then
            echo "::error::The end-to-end suite skipped because no browser was found. CI must run it."
            exit 1
          fi
          echo "$out" | grep -E "^# (tests|pass|fail)"

      - name: Verify the RFC claims against this runner's browser
        run: npm run evidence

  gate:
    name: ship gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # Same choice as the test job: a released Chrome over a Chromium snapshot.
      - name: Choose the browser
        shell: bash
        timeout-minutes: 2
        run: |
          chrome_app="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -x "$chrome_app" ]; then
            picked="$chrome_app"
          else
            picked="${{ steps.chrome.outputs.chrome-path }}"
          fi
          echo "NOTLOCALHOST_BROWSER_PATH=$picked" >> "$GITHUB_ENV"
          echo "using: $picked"
          # Deliberately no `--version` here. On Windows chrome.exe does not
          # print a version and exit; it hands off to an existing browser
          # session and never returns, which hangs the step until the job
          # timeout. The later diagnostic step probes the version through
          # Node, which bounds it.

      - name: Pack the tarball a user would install
        id: pack
        shell: bash
        run: |
          npm install --no-audit --no-fund
          file=$(npm pack --silent)
          echo "tarball=$PWD/$file" >> "$GITHUB_OUTPUT"
          echo "package size: $(du -k "$file" | cut -f1) KB"

      # Resolve the browser before anything depends on it. A path that cannot be
      # launched should say so here, by name, rather than surfacing later as an
      # opaque non-zero exit from a timed step.
      - name: Resolve the browser
        shell: bash
        run: |
          echo "browser chosen: $NOTLOCALHOST_BROWSER_PATH"
          [ -e "$NOTLOCALHOST_BROWSER_PATH" ] && echo "exists: yes" || echo "exists: NO"
          [ -f "$NOTLOCALHOST_BROWSER_PATH" ] && echo "kind: regular file"
          [ -d "$NOTLOCALHOST_BROWSER_PATH" ] && echo "kind: directory (a macOS bundle, or a folder)"
          node -e '
            const { resolveBrowserExecutable, locateBrowser } = await import("./src/browser/locate.js");
            const given = process.env.NOTLOCALHOST_BROWSER_PATH;
            console.log("resolved to:", resolveBrowserExecutable(given) ?? "(nothing)");
            const b = locateBrowser();
            console.log("locateBrowser:", b.name, "->", b.path);
          ' --input-type=module

      # The npx promise: cold cache to finished analysis in under 30 seconds.
      - name: Cold-cache install and full analysis, timed
        shell: bash
        run: |
          set -e
          node test/fixtures/lying-app.mjs --port 3000 --api-port 4000 --quiet &
          fixture=$!
          trap 'kill $fixture 2>/dev/null || true' EXIT

          # Wait for the fixture rather than sleeping a fixed amount.
          for _ in $(seq 1 40); do
            if node -e 'require("net").connect(3000,"127.0.0.1").on("connect",()=>process.exit(0)).on("error",()=>process.exit(1))'; then break; fi
            sleep 0.25
          done

          work=$(mktemp -d)
          cache=$(mktemp -d)
          cd "$work"
          echo '{"name":"coldtest","private":true}' > package.json

          start=$(node -e 'console.log(Date.now())')
          npm install --cache "$cache" --no-audit --no-fund "${{ steps.pack.outputs.tarball }}" > /dev/null

          # Capture the exit code rather than letting `set -e` abort with no
          # explanation. The codes are documented and each one means something
          # specific, so reporting it turns a silent CI failure into a diagnosis.
          set +e
          ./node_modules/.bin/notlocalhost http://localhost:3000 --no-html --quiet --fail-on none
          code=$?
          set -e
          end=$(node -e 'console.log(Date.now())')

          if [ "$code" -ne 0 ]; then
            case "$code" in
              2)  reason="target unreachable - the fixture server was not answering" ;;
              5)  reason="tool failure - no usable browser, or an internal error" ;;
              64) reason="usage error - the arguments above are wrong" ;;
              *)  reason="unexpected exit code" ;;
            esac
            echo "::error title=Cold run failed::exit $code ($reason)"

            # Job logs need admin rights to read through the API, but annotations
            # do not. Promote the diagnosis to annotations so the failure is
            # legible to anyone who can see the run.
            echo "--- re-running verbosely ---"
            ./node_modules/.bin/notlocalhost http://localhost:3000 --no-html --verbose --fail-on none > verbose.txt 2>&1 || true
            cat verbose.txt
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Cold run detail::${line}"
            done < <(grep -vE '^\s*$' verbose.txt | tail -20)

            node -e 'require("net").connect(3000,"127.0.0.1").on("connect",()=>{console.log("fixture: port 3000 accepting connections");process.exit(0)}).on("error",e=>{console.log("fixture: port 3000 "+e.message);process.exit(0)})' > fixture.txt 2>&1 || true
            cat fixture.txt
            echo "::error title=Fixture state::$(cat fixture.txt | tr '\n' ' ')"
            exit 1
          fi

          elapsed=$(( end - start ))
          size=$(du -sk node_modules | cut -f1)
          echo "cold install + analysis: ${elapsed} ms"
          echo "installed size: ${size} KB"
          echo "- cold npx: **${elapsed} ms**, install **${size} KB**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$elapsed" -gt 30000 ]; then
            echo "::error::Cold npx took ${elapsed} ms, over the 30 s budget."
            exit 1
          fi

      # The suite above exercises the source tree. This exercises the artefact a
      # user actually installs: pack, install into a throwaway directory, and
      # drive every documented command, output format and exit code.
      - name: The packed artefact must work end to end
        shell: bash
        run: npm run smoke

      - name: The HTML report must open from the filesystem with no server
        shell: bash
        run: npm run test:report

      - name: Exit codes must be exactly as documented
        shell: bash
        run: |
          set +e
          node bin/notlocalhost.js --help > /dev/null;                        [ $? -eq 0 ]  || { echo "--help should exit 0"; exit 1; }
          node bin/notlocalhost.js --fail-on bogus > /dev/null 2>&1;          [ $? -eq 64 ] || { echo "bad args should exit 64"; exit 1; }
          node bin/notlocalhost.js http://127.0.0.1:39399 --no-html --timeout 5000 > /dev/null 2>&1
          [ $? -eq 2 ] || { echo "unreachable should exit 2"; exit 1; }
          echo "exit codes 0, 64 and 2 confirmed"

  # The Stage 2 gate: init, up, a real HTTPS request, down, machine unchanged.
  # Run on every platform, because the last two bugs here were ones a single
  # operating system hid completely.
  harness:
    name: harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # Only to look up the latest Caddy release. Anonymous api.github.com allows
    # 60 requests an hour per IP, and hosted runners share addresses, so a job
    # can be rate-limited without having made a request of its own. The harness
    # needs no token when a person runs it on their own machine.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The lifecycle suite skips itself when no Caddy is present, so fetching
      # one is what makes the gate run at all rather than silently pass.
      - name: Fetch Caddy, verified against its published digest
        shell: bash
        run: |
          node --input-type=module -e '
            const { resolveCaddy } = await import("./src/harness/caddy.js");
            const r = await resolveCaddy({ log: (m) => console.log(m) });
            console.log(`${r.path}  (${r.source})`);
          '

      - name: All suites, judged by output rather than exit code
        run: node scripts/check-test-output.mjs --min 200

      - name: Every harness suite, asserting each one actually ran
        shell: bash
        run: |
          set -uo pipefail
          failed=0

          run_suite () {
            local name="$1" file="$2" expect="$3"
            local log code ran

            # Streamed through tee, not captured into a variable.
            #
            # This was out=$(node --test ...), printed afterwards. That shows
            # nothing at all when the process is killed or the shell dies
            # part-way -- the diagnostic swallowing exactly the case it exists
            # for. On windows-latest it produced a log that simply stopped
            # after the previous suite, with no way to tell how far this one
            # got, or whether it started.
            log="$RUNNER_TEMP/suite-$name.log"
            echo "==> running $name ($file)"
            node --test "$file" 2>&1 | tee "$log"; code=${PIPESTATUS[0]}
            echo "<== $name exited $code"

            ran=$(grep -E "^# tests " "$log" | grep -oE "[0-9]+" | head -1)
            ran=${ran:-0}

            echo "$name: $(grep -E '^# (tests|pass|fail|skipped)' "$log" | tr '\n' ' ')"

            # A suite that ran nothing proves nothing and exits 0 while doing
            # it. Node reports a wholly-skipped describe as "# tests 0" rather
            # than as a skip, which is how the gate once reported a pass
            # without running.
            if [ "$ran" -lt "$expect" ]; then
              echo "::error title=$name proved nothing::expected at least $expect tests, $ran ran"
              failed=1
            fi
            if grep -q "^# skipped [1-9]" "$log"; then
              echo "::error title=$name skipped tests::CI must run every test"
              failed=1
            fi
            if [ "$code" -ne 0 ]; then
              echo "::error title=$name failed::exit $code; its output is above, streamed live"
              failed=1
            fi
          }

          run_suite compat    test/compat.test.js    25
          run_suite harness   test/harness.test.js   50
          run_suite lifecycle test/lifecycle.test.js 15

          exit $failed

      - name: doctor must report without changing anything
        shell: bash
        run: |
          digest () {
            node --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readFileSync } from "node:fs";
              import { join } from "node:path";
              const p = process.platform === "win32"
                ? join(process.env.SystemRoot, "System32", "drivers", "etc", "hosts")
                : "/etc/hosts";
              try { console.log(createHash("sha256").update(readFileSync(p)).digest("hex")); }
              catch { console.log("unreadable"); }
            '
          }

          before=$(digest)
          [ "$before" = "unreadable" ] && { echo "::error title=cannot read the hosts file::the check would prove nothing"; exit 1; }

          # doctor exits 1 when it finds a blocking issue, exactly as the
          # analyzer exits 1 on findings: someone will want to branch on it.
          # A runner already holding port 80 is a fact about the machine, and
          # reporting it is doctor working rather than failing. Only 0 and 1
          # mean "it reported"; anything higher is a real fault.
          set +e
          node bin/notlocalhost.js doctor
          code=$?
          set -e

          after=$(digest)
          if [ "$before" != "$after" ]; then
            echo "::error title=doctor mutated the machine::the hosts file changed while doctor ran"
            exit 1
          fi
          echo "hosts file unchanged by doctor ($before)"

          if [ "$code" -gt 1 ]; then
            echo "::error title=doctor failed::exit $code is a fault, not a finding"
            exit 1
          fi
          echo "doctor exited $code"

  # The one thing the suites deliberately never do.
  #
  # Every lifecycle test passes trust: false, because a test that writes to a
  # developer's real trust store is not one anybody should run by accident. The
  # consequence was that the most consequential code here -- the part that puts
  # a root certificate on a machine -- had only ever been exercised by hand, on
  # one operating system, by one person.
  #
  # A throwaway runner is the right place to do it for real. The assertion that
  # matters is not that removal reported success: it is that the store holds
  # exactly as many roots afterwards as it did before. A removal that deletes
  # the wrong certificate reports success and fails that count -- and deleting
  # the wrong certificate is a bug this project has actually shipped, on macOS,
  # where every Caddy authority shares a subject.
  trust:
    name: trust round trip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Chrome's certificate store on Linux is an NSS database, and the tool
      # that writes it ships separately from the browser. Without this the job
      # would exercise the failure path rather than the install.
      - name: Install the NSS tools Chrome's store needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools

      - name: Install a CA, verify it, remove it, verify the store is unchanged
        run: node scripts/trust-roundtrip.mjs
