name: Bug report
description: Something crashed, hung, or produced nonsense
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: shell
      placeholder: npx notlocalhost http://localhost:3000 --flow ./login.js
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        Re-run with `--verbose` for a stack trace. Redact anything sensitive --
        reports from authenticated runs can contain live session tokens.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: notlocalhost version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Output of `npx notlocalhost --list-browsers`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
